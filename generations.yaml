generations:
  - name: "First Generation (Geo Prizm)"
    start_year: 1990
    end_year: 1992
    description: "The Geo Prizm was introduced in February 1989 for the 1990 model year under GM's new Geo brand as a rebadged version of the Toyota Sprinter and Toyota Corolla (E90 platform). The hatchback version was a rebadged Toyota Sprinter Cielo with the same front clip as the sedan. Available as a four-door sedan or five-door hatchback (hatchback dropped after 1991), it was powered by Toyota 1.6L four-cylinder engines, with a more powerful 130 HP 4A-GE twin-cam GSi performance model available. The regular engine offered 102 HP. In addition to base and GSi trim levels, the LSi provided better equipment and body-colored bumpers. This generation represented GM's strategy to offer Japanese-engineered vehicles under its domestic brands to compete with rising Japanese imports. Production at NUMMI (New United Motor Manufacturing, Inc.), a joint venture between GM and Toyota in Fremont, California, ran from 1989 to 1992."

  - name: "Second Generation (Geo Prizm)"
    start_year: 1993
    end_year: 1997
    description: "The second-generation Prizm debuted in 1992 for the 1993 model year on the Toyota Corolla (E100) platform. The hatchback variant was discontinued in favor of a sedan-only configuration. The Prizm gained more room, resulting in an upgrade to EPA 'compact' car status, and received a driver's-side airbag and new optional 1.8-liter 7A-FE four-cylinder engine. The base engine remained the 1.6L 4A-FE. With the larger engine came a rear stabilizer bar, wider tires, and an optional four-speed automatic transmission (in place of the previous three-speed). A second airbag became standard in 1994. Leather seats were available on the LSi trim. The interior maintained Toyota's quality and ergonomics. The Geo brand was phased out in 1997. Production at NUMMI ran from 1992 to 1997, with the last under the Geo nameplate."

  - name: "Third Generation (Chevrolet Prizm)"
    start_year: 1998
    end_year: 2002
    description: "The 1998 redesign coincided with the conversion of the Geo brand to Chevrolet, as General Motors discontinued the Geo brand entirely after 1997. The third-generation Prizm was built on the Toyota Corolla (E110) platform and featured an all-new all-aluminum 1.8L 1ZZ-FE four-cylinder engine driven by a timing chain, which made more power than the A-series engines from the Geo era while maintaining fuel economy. This engine incorporated laser-etched valve guides in the cylinder head. For 2000, the engine gained variable valve timing (VVT-i) for a slight increase in power from 120 to 125 HP. The Prizm and Corolla became the first cars in the compact class to offer optional side airbags. All 1998 models without the optional handling package had sloppy emergency handling, addressed in 1999 by making the package standard. Available in base and LSi trim levels, it offered a five-speed manual or three/four-speed automatic transmission. The last Prizm was built on December 13, 2001, for the 2002 model year. Production at NUMMI ran from 1997 to 2001. The Prizm was replaced by the Pontiac Vibe starting in 2003."
